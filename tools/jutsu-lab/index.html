<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Laboratório de jutsus — Vila Ninja</title>
    <link rel="stylesheet" href="./lab.css" />
  </head>
  <body>
    <aside id="side">
      <header>
        <b>Laboratório de jutsus</b>
        <a href="/" class="link">Editor de sprites</a>
      </header>
      <section class="opts">
        <label>Ritmo</label>
        <div class="seg" id="pace"><button data-v="fast" class="on">Rápido</button><button data-v="tactical">Tático (selos)</button></div>
        <label>Distância</label>
        <div class="seg" id="dist"><button data-v="40">Perto</button><button data-v="100" class="on">Média</button><button data-v="160">Longe</button></div>
        <label>Velocidade</label>
        <div class="seg" id="speed"><button data-v="0.25">¼×</button><button data-v="0.5">½×</button><button data-v="1" class="on">1×</button></div>
        <label>Natureza do ninja (Shunshin)</label>
        <div class="seg" id="nature"><button data-v="katon" class="on">Fogo</button><button data-v="suiton">Água</button><button data-v="doton">Terra</button><button data-v="raiton">Raio</button><button data-v="fuuton">Vento</button></div>
      </section>
      <div id="lists"></div>
    </aside>
    <main>
      <canvas id="view"></canvas>
      <div id="hud"><span id="now">Toque num jutsu à esquerda</span><button id="reset">Reiniciar posições</button></div>
    </main>
    <script type="module" src="./lab.ts"></script>
  </body>
</html>
